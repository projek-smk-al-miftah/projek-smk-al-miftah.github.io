<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPPO STORE — Discover Your Smartphone</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="logo">OPPO STORE</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#home" class="active">Beranda</a></li>
        <li><a href="#produk">Produk</a></li>
        <li><a href="#fitur">Keunggulan</a></li>
        <li><a href="#kontak">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <div class="hero-text">
      <span class="badge">Model Terbaru 2026</span>
      <h1>Hebat, Gaya Lebih Elegan.</h1>
      <p>Smartphone OPPO dengan desain modern, kamera berkualitas, performa cepat, dan teknologi yang mendukung aktivitas sehari-hari.</p>
      <div class="cta-buttons">
        <a href="#produk" class="btn btn-primary">Lihat Produk</a>
        <a href="#detail" class="btn btn-secondary">Lebih Lanjut &rarr;</a>
      </div>
    </div>
    
    <div class="hero-image">
      <div class="image-wrapper">
        <!-- Ganti src dengan gambar smartphone Anda -->
        <img src="https://via.placeholder.com/450x550" alt="OPPO Smartphone">
      </div>
    </div>
  </section>

</body>
</html>
