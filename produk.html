<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog HP OPPO Terbaru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">OPPO Store</div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="produk.html">Produk</a>
            <a href="pencarian.html">Cari</a>
            <a href="keranjang.html">Keranjang</a>
            <a href="tentang.html">Tentang</a>
            <a href="kontak.html">Kontak</a>
        </nav>
    </header>

    <div class="container">
        <h2>Semua Series HP OPPO</h2>
        <br>
        <div class="product-grid">
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="OPPO Find N3 Flip">
                <h3>OPPO Find N3 Flip</h3>
                <p class="price">Rp 15.999.000</p>
                <a href="detail.html" class="btn">Detail</a>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="OPPO Reno 11 5G">
                <h3>OPPO Reno 11 5G</h3>
                <p class="price">Rp 5.999.000</p>
                <a href="detail.html" class="btn">Detail</a>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/300" alt="OPPO A78 5G">
                <h3>OPPO A78 5G</h3>
                <p class="price">Rp 3.599.000</p>
                <a href="detail.html" class="btn">Detail</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Toko HP OPPO Terbaru.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
