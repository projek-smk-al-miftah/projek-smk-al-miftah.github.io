<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Produk - OPPO Store</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">OPPO STORE</a>
            <ul class="nav-links">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="produk.html">Produk</a></li>
                <li><a href="pencarian.html" class="active">Cari</a></li>
                <li><a href="keranjang.html" class="cart-link">🛒 Keranjang (<span id="cart-count">0</span>)</a></li>
                <li><a href="tentang.html">Tentang</a></li>
                <li><a href="kontak.html">Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Pencarian Produk OPPO</h2>
        <div style="background: #fff; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 2rem;">
            <input type="text" id="search-input" placeholder="Ketik nama smartphone yang dicari (contoh: Reno, Find, A78)..." style="width: 100%; padding: 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-size: 1rem; outline: none;">
        </div>

        <div class="product-grid" id="search-results">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=400&auto=format&fit=crop" alt="Reno">
                <div>
                    <h3>OPPO Reno 11 Pro 5G</h3>
                    <p class="price">Rp 7.999.000</p>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: center;">
                    <a href="detail.html" class="btn-secondary">Detail</a>
                    <button class="btn-primary add-to-cart" data-name="OPPO Reno 11 Pro 5G" data-price="Rp 7.999.000" data-image="https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=400&auto=format&fit=crop">+ Beli</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1565849904461-04a58ad377e0?q=80&w=400&auto=format&fit=crop" alt="Find">
                <div>
                    <h3>OPPO Find X7 Ultra</h3>
                    <p class="price">Rp 14.999.000</p>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: center;">
                    <a href="detail.html" class="btn-secondary">Detail</a>
                    <button class="btn-primary add-to-cart" data-name="OPPO Find X7 Ultra" data-price="Rp 14.999.000" data-image="https://images.unsplash.com/photo-1565849904461-04a58ad377e0?q=80&w=400&auto=format&fit=crop">+ Beli</button>
                </div>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=400&auto=format&fit=crop" alt="A78">
                <div>
                    <h3>OPPO A78 5G</h3>
                    <p class="price">Rp 3.599.000</p>
                </div>
                <div style="display: flex; gap: 0.5rem; justify-content: center;">
                    <a href="detail.html" class="btn-secondary">Detail</a>
                    <button class="btn-primary add-to-cart" data-name="OPPO A78 5G" data-price="Rp 3.599.000" data-image="https://images.unsplash.com/photo-1580910051074-3eb694886505?q=80&w=400&auto=format&fit=crop">+ Beli</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 OPPO Store. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
