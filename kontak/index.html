<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Kontak & Profil</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome CDN untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="card">
    <div class="profile-header">
      <div class="avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <h2>Profil Saya</h2>
      <p>Hubungi atau temukan saya di platform berikut</p>
    </div>

    <div class="links-container">
      <!-- Kotak WhatsApp -->
      <a href="https://wa.me/6281234567890" target="_blank" class="btn btn-whatsapp">
        <div class="icon">
          <i class="fa-brands fa-whatsapp"></i>
        </div>
        <div class="text">
          <span>WhatsApp</span>
          <small>Chat via WhatsApp</small>
        </div>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>

      <!-- Kotak Akun Google -->
      <a href="mailto:emailanda@gmail.com" target="_blank" class="btn btn-google">
        <div class="icon">
          <i class="fa-brands fa-google"></i>
        </div>
        <div class="text">
          <span>Akun Google</span>
          <small>Kirim Email via Gmail</small>
        </div>
        <i class="fa-solid fa-chevron-right arrow"></i>
      </a>
    </div>
  </div>
</body>
</html>
